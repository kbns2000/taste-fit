[project]
name = "taste-fit"
version = "0.1.0"
description = "Brand partnership agent on the Qloo Insights API: taste-fit score, joint-audience activations, evidence-cited brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.161.1",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "anthropic==2.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "huggingface_hub==2.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
