# Render's free web service sleeps after 15 minutes without traffic (waking takes 30-60 s);
# a ping every 10 minutes keeps the demo warm for judges. Set the repo variable DEMO_URL to enable.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.DEMO_URL }}/healthz" || curl -fsS --max-time 120 "${{ vars.DEMO_URL }}/healthz"
