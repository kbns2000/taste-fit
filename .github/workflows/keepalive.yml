# Free Hugging Face Spaces sleep after 48h without traffic; a small ping keeps the demo warm for judges.
name: keepalive
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.DEMO_URL }}/healthz" || curl -fsS --max-time 120 "${{ vars.DEMO_URL }}/healthz"
