# Render's free web service sleeps after 15 minutes without traffic (waking takes 30-60 s);
# a ping every 10 minutes keeps the demo warm for judges. The repo variable DEMO_URL overrides the default host.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: ${{ vars.DEMO_URL || 'https://taste-fit.onrender.com' }}
    steps:
      - run: curl -fsS --max-time 60 "$DEMO_URL/healthz" || curl -fsS --max-time 120 "$DEMO_URL/healthz"
